<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el Amor de Mi Vida - 21 de Septiembre</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;500;600&family=Sacramento&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030208;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
        }

        .interactive {
            pointer-events: auto;
        }

        .font-title {
            font-family: 'Cinzel', serif;
        }

        .font-cursive {
            font-family: 'Sacramento', cursive;
        }

        .font-love {
            font-family: 'Great Vibes', cursive;
        }

        /* Glassmorphism UI */
        .glass-card {
            background: rgba(12, 8, 24, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 105, 180, 0.45);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 20, 147, 0.3), inset 0 0 15px rgba(255, 182, 193, 0.15);
        }

        .glow-text-pink {
            text-shadow: 0 0 12px rgba(255, 20, 147, 0.9), 0 0 25px rgba(255, 105, 180, 0.6);
        }

        .glow-text-yellow {
            text-shadow: 0 0 14px rgba(255, 215, 0, 0.95), 0 0 28px rgba(255, 215, 0, 0.7);
        }

        /* Heart animation */
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 50;
        }

        #love-modal {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* Floating Joshua photo animation */
        @keyframes floatPhoto {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        .joshua-card {
            animation: floatPhoto 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-white relative">

    <!-- Canvas WebGL de Three.js -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        
        <!-- Header: Título encuadrado y alineado -->
        <header class="w-full flex justify-center mt-2 md:mt-3">
            <div class="glass-card px-6 sm:px-10 py-5 rounded-3xl text-center max-w-xl w-11/12 interactive shadow-2xl relative overflow-hidden flex flex-col items-center justify-center">
                <!-- Destellos brillantes de fondo -->
                <div class="absolute -top-12 -left-12 w-32 h-32 bg-pink-500/20 rounded-full blur-2xl"></div>
                <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-amber-500/20 rounded-full blur-2xl"></div>

                <span class="text-pink-400 font-love text-4xl sm:text-5xl md:text-6xl block glow-text-pink leading-tight w-full text-center">
                    Para el Amor de Mi Vida
                </span>
                
                <h1 class="font-title text-sm sm:text-lg md:text-xl font-black tracking-widest text-amber-300 uppercase glow-text-yellow my-1.5 w-full text-center">
                    ¡Feliz 21 de Septiembre!
                </h1>

                <div class="w-40 h-0.5 bg-gradient-to-r from-transparent via-pink-500 to-transparent my-2"></div>

                <p class="text-xs sm:text-sm text-pink-100 font-light tracking-wide leading-relaxed w-full text-center">
                    De: <span class="text-cyan-300 font-semibold">El Señor Alejandro</span> &nbsp;|&nbsp; 
                    Para: <span class="text-amber-300 font-semibold">Su Señorita Enamorada</span>
                </p>
            </div>
        </header>

        <!-- Tarjeta Flotante de Joshua (Garantiza que la imagen sea visible siempre) -->
        <div class="absolute right-4 sm:right-10 top-1/2 -translate-y-1/2 interactive hidden md:block">
            <div class="joshua-card glass-card p-3 rounded-2xl border-2 border-pink-400/60 shadow-2xl shadow-pink-500/30 text-center max-w-[210px]">
                <div class="relative overflow-hidden rounded-xl border border-pink-300/40 shadow-inner bg-black/40">
                    <img src="imagenes/joshua.jpg" alt="Joshua" class="w-full h-52 object-cover rounded-xl" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'p-6 text-xs text-pink-200\'><i class=\'fa-solid fa-image text-2xl text-pink-400 mb-2 block\'></i>Coloque la foto en:<br><span class=\'font-mono text-amber-300\'>imagenes/joshua.jpg</span></div>';">
                </div>
                <p class="font-cursive text-2xl text-amber-300 mt-2 glow-text-yellow">Joshua</p>
            </div>
        </div>

        <!-- Footer: Botones de Acción -->
        <footer class="w-full flex justify-center mb-4 md:mb-6">
            <div class="glass-card p-4 sm:p-5 rounded-2xl text-center max-w-sm w-11/12 interactive shadow-2xl border-pink-500/40">
                <p class="text-xs sm:text-sm md:text-base font-medium mb-3.5 text-pink-100">
                    ¿Aceptas este ramo de girasoles y mi corazón entero?
                </p>
                
                <div class="flex justify-center gap-3">
                    <!-- Botón Aceptar -->
                    <button id="btn-accept" class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 text-slate-950 font-bold hover:from-pink-400 hover:to-amber-300 transition-all duration-300 transform hover:scale-105 shadow-lg shadow-pink-500/40 flex items-center justify-center gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-heart text-red-600 animate-pulse"></i> ¡Sí, Acepto!
                    </button>
                    
                    <!-- Botón Rechazar -->
                    <button id="btn-reject" class="py-2.5 px-4 rounded-xl bg-zinc-900/90 border border-zinc-700 text-gray-400 font-medium hover:bg-zinc-800 hover:text-white transition-all duration-300 transform hover:scale-95 flex items-center justify-center gap-1.5 text-xs sm:text-sm">
                        <i class="fa-solid fa-xmark text-gray-400"></i> No
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modal "I LOVE YOU" al aceptar -->
    <div id="love-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-500">
        <div class="glass-card p-8 md:p-12 rounded-3xl text-center max-w-md mx-4 border-2 border-pink-500/60 shadow-2xl shadow-pink-500/50 transform scale-90 transition-transform duration-500" id="modal-box">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-pink-950/80 border border-pink-400 flex items-center justify-center text-amber-400 text-4xl shadow-lg shadow-pink-500/40">
                <i class="fa-solid fa-heart text-pink-500 animate-bounce"></i>
            </div>
            
            <h2 class="font-love text-6xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-amber-200 to-rose-400 my-2 drop-shadow-[0_0_25px_rgba(255,105,180,0.9)]">
                I LOVE YOU
            </h2>
            
            <p class="text-pink-200 text-sm md:text-base mt-2 font-light">
                Redirigiendo a tu sorpresa musical...
            </p>
            
            <div class="w-full bg-gray-800 h-1.5 rounded-full mt-6 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-pink-500 via-rose-400 to-amber-400 h-full w-0 transition-all duration-3000 ease-linear"></div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN THREE.JS & ESCENA ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030208, 0.022);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.8, 8.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        container.appendChild(renderer.domElement);

        // Control de rotación interactiva
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 14;
        controls.minDistance = 4.0;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.target.set(0, 0.1, 0);

        // --- ILUMINACIÓN CÓSMICA Y ROMÁNTICA ---
        const ambientLight = new THREE.AmbientLight(0x331122, 1.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5cc, 2.5);
        sunLight.position.set(6, 9, 6);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const pinkFill = new THREE.PointLight(0xff1493, 4.0, 15);
        pinkFill.position.set(-5, -1, 4);
        scene.add(pinkFill);

        const goldGlow = new THREE.PointLight(0xffaa00, 3.5, 12);
        goldGlow.position.set(0, 1.2, 2.5);
        scene.add(goldGlow);

        const cyanGlow = new THREE.PointLight(0x00f3ff, 2.5, 10);
        cyanGlow.position.set(4, -2, -2);
        scene.add(cyanGlow);

        // --- GENERADOR DE TEXTURA PROCEDURAL PARA GIRASOL ---
        function generateSunflowerCenterTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1c0c02';
            ctx.fillRect(0, 0, size, size);

            const centerX = size / 2;
            const centerY = size / 2;
            const numSeeds = 1000;
            const goldenAngle = 137.508 * (Math.PI / 180);

            for (let i = 0; i < numSeeds; i++) {
                const r = Math.sqrt(i) * 7.5;
                const theta = i * goldenAngle;
                const x = centerX + r * Math.cos(theta);
                const y = centerY + r * Math.sin(theta);

                if (x < 0 || x > size || y < 0 || y > size) continue;

                const seedRadius = 2.2 + Math.sin(i) * 0.5;

                ctx.beginPath();
                ctx.arc(x, y, seedRadius, 0, Math.PI * 2);
                
                if (i < 300) {
                    ctx.fillStyle = (i % 2 === 0) ? '#282006' : '#140c02';
                } else if (i > 800) {
                    ctx.fillStyle = (i % 3 === 0) ? '#d49600' : '#3d1f03';
                } else {
                    ctx.fillStyle = (i % 2 === 0) ? '#241103' : '#381c05';
                }
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const centerTexture = generateSunflowerCenterTexture();

        // Grupo Principal del Ramo
        const bouquetGroup = new THREE.Group();
        bouquetGroup.position.set(0, -0.6, 0);
        scene.add(bouquetGroup);

        // --- CONSTRUCTOR DE GIRASOL ---
        function createCleanSunflower() {
            const flower = new THREE.Group();

            // Centro
            const centerGeo = new THREE.CylinderGeometry(0.55, 0.48, 0.1, 32);
            const centerMat = new THREE.MeshStandardMaterial({
                map: centerTexture,
                roughness: 0.85,
                metalness: 0.05
            });
            const centerMesh = new THREE.Mesh(centerGeo, centerMat);
            centerMesh.rotation.x = Math.PI / 2;
            centerMesh.castShadow = true;
            flower.add(centerMesh);

            // Pétalos
            const petalShape = new THREE.Shape();
            petalShape.moveTo(0, 0);
            petalShape.quadraticCurveTo(0.12, 0.35, 0.09, 0.9);
            petalShape.quadraticCurveTo(0, 1.2, 0, 1.3);
            petalShape.quadraticCurveTo(0, 1.2, -0.09, 0.9);
            petalShape.quadraticCurveTo(-0.12, 0.35, 0, 0);

            const extrudeSettings = { depth: 0.02, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.015 };
            const petalGeo = new THREE.ExtrudeGeometry(petalShape, extrudeSettings);

            const petalMat1 = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.35, metalness: 0.1 });
            const petalMat2 = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4, metalness: 0.08 });

            const count = 24;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                
                const petal1 = new THREE.Mesh(petalGeo, petalMat1);
                petal1.position.set(0, 0, -0.01);
                petal1.rotation.z = angle;
                petal1.rotation.x = 0.1;
                petal1.scale.set(0.48, 0.58, 0.5);
                flower.add(petal1);

                const petal2 = new THREE.Mesh(petalGeo, petalMat2);
                petal2.position.set(0, 0, -0.03);
                petal2.rotation.z = angle + (Math.PI / count);
                petal2.rotation.x = 0.22;
                petal2.scale.set(0.52, 0.62, 0.5);
                flower.add(petal2);
            }

            // Tallo vertical corto
            const stemGeo = new THREE.CylinderGeometry(0.045, 0.045, 1.8, 12);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x1d4a1f, roughness: 0.7 });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.set(0, -0.9, -0.1);
            flower.add(stem);

            return flower;
        }

        // Posiciones de Girasoles en el Ramo
        const sunflowerConfigs = [
            { pos: [0, 1.1, 0.2], rot: [0, 0, 0], scale: 1.05 },
            { pos: [-0.8, 0.7, 0.15], rot: [0.1, -0.3, 0.15], scale: 0.95 },
            { pos: [0.8, 0.7, 0.15], rot: [0.1, 0.3, -0.15], scale: 0.95 },
            { pos: [-0.5, 0.1, 0.35], rot: [0.2, -0.18, 0.1], scale: 0.98 },
            { pos: [0.5, 0.1, 0.35], rot: [0.2, 0.18, -0.1], scale: 0.98 },
            { pos: [0, -0.4, 0.45], rot: [0.3, 0, 0], scale: 1.0 }
        ];

        sunflowerConfigs.forEach(cfg => {
            const sf = createCleanSunflower();
            sf.position.set(...cfg.pos);
            sf.rotation.set(...cfg.rot);
            sf.scale.setScalar(cfg.scale);
            bouquetGroup.add(sf);
        });

        // Envoltorio elegante
        const wrapGeo = new THREE.ConeGeometry(2.0, 3.4, 12, 1, true, 0, Math.PI * 1.35);
        const wrapMat = new THREE.MeshStandardMaterial({ color: 0x08080c, roughness: 0.35, metalness: 0.75, side: THREE.DoubleSide });
        const wrapper = new THREE.Mesh(wrapGeo, wrapMat);
        wrapper.position.set(0, -0.85, -0.2);
        wrapper.rotation.x = Math.PI;
        wrapper.rotation.y = -Math.PI * 0.68;
        bouquetGroup.add(wrapper);

        const innerWrapGeo = new THREE.ConeGeometry(1.85, 3.0, 10, 1, true, 0, Math.PI * 1.1);
        const innerWrapMat = new THREE.MeshStandardMaterial({ color: 0x2b001a, emissive: 0x15000a, roughness: 0.4, metalness: 0.8, side: THREE.DoubleSide });
        const innerWrapper = new THREE.Mesh(innerWrapGeo, innerWrapMat);
        innerWrapper.position.set(0, -0.7, -0.1);
        innerWrapper.rotation.x = Math.PI;
        innerWrapper.rotation.y = -Math.PI * 0.55;
        bouquetGroup.add(innerWrapper);

        const ribbonGeo = new THREE.TorusGeometry(0.4, 0.08, 16, 32);
        const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xff1493, emissive: 0x880044, roughness: 0.15, metalness: 0.95 });
        const ribbon = new THREE.Mesh(ribbonGeo, ribbonMat);
        ribbon.position.set(0, -1.55, 0.25);
        ribbon.rotation.x = Math.PI / 2.3;
        bouquetGroup.add(ribbon);

        // --- CORAZONES 3D FLOTANTES EN ÓRBITA ---
        function createHeartGeometry() {
            const heartShape = new THREE.Shape();
            const x = 0, y = 0;
            heartShape.moveTo(x + 0.25, y + 0.25);
            heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
            heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
            heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
            heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
            heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
            heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

            const extrudeSettings = { depth: 0.08, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.03, bevelThickness: 0.03 };
            const geo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geo.center();
            return geo;
        }

        const heartGeo = createHeartGeometry();
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        const heartMaterials = [
            new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x990033, roughness: 0.2, metalness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0xff69b4, emissive: 0xaa1155, roughness: 0.2, metalness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa8800, roughness: 0.2, metalness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x0088aa, roughness: 0.2, metalness: 0.8 })
        ];

        const orbitingHearts = [];
        const numHearts = 24;

        for (let i = 0; i < numHearts; i++) {
            const mat = heartMaterials[i % heartMaterials.length];
            const mesh = new THREE.Mesh(heartGeo, mat);
            
            const radius = 2.4 + Math.random() * 2.2;
            const angle = (i / numHearts) * Math.PI * 2;
            const yPos = (Math.random() - 0.5) * 4.0;
            const scale = 0.22 + Math.random() * 0.28;

            mesh.scale.setScalar(scale);
            mesh.position.set(Math.cos(angle) * radius, yPos, Math.sin(angle) * radius);

            heartGroup.add(mesh);

            orbitingHearts.push({
                mesh: mesh,
                radius: radius,
                angle: angle,
                speed: 0.005 + Math.random() * 0.008,
                yOffset: yPos,
                rotSpeedX: (Math.random() - 0.5) * 0.03,
                rotSpeedY: (Math.random() - 0.5) * 0.03
            });
        }

        // --- POLVO ESTELAR Y LUCES ---
        const starCount = 1800;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 30;
            starPositions[i + 1] = (Math.random() - 0.5) * 30;
            starPositions[i + 2] = (Math.random() - 0.5) * 30;

            const rand = Math.random();
            if (rand > 0.6) {
                starColors[i] = 1; starColors[i + 1] = 0.4; starColors[i + 2] = 0.7; // Rosa
            } else if (rand > 0.3) {
                starColors[i] = 1; starColors[i + 1] = 0.85; starColors[i + 2] = 0.2; // Oro
            } else {
                starColors[i] = 0; starColors[i + 1] = 0.95; starColors[i + 2] = 1; // Cian
            }
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMat = new THREE.PointsMaterial({ size: 0.055, vertexColors: true, transparent: true, opacity: 0.9 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- RESPONSIVIDAD ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- BUCLE DE ANIMACIÓN ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Flotación suave del ramo
            bouquetGroup.rotation.y = Math.sin(elapsedTime * 0.25) * 0.12;
            bouquetGroup.position.y = -0.6 + Math.sin(elapsedTime * 1.1) * 0.06;

            // Rotación del fondo estelar
            starField.rotation.y = elapsedTime * 0.012;

            // Órbita y rotación de corazones
            orbitingHearts.forEach(h => {
                h.angle += h.speed;
                h.mesh.position.x = Math.cos(h.angle) * h.radius;
                h.mesh.position.z = Math.sin(h.angle) * h.radius;
                h.mesh.position.y = h.yOffset + Math.sin(elapsedTime * 1.5 + h.angle) * 0.25;

                h.mesh.rotation.x += h.rotSpeedX;
                h.mesh.rotation.y += h.rotSpeedY;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- INTERACCIÓN Y BOTONES ---
        const btnAccept = document.getElementById('btn-accept');
        const btnReject = document.getElementById('btn-reject');
        const loveModal = document.getElementById('love-modal');
        const modalBox = document.getElementById('modal-box');
        const progressBar = document.getElementById('progress-bar');

        const REJECT_URL = "https://www.youtube.com/watch?v=r3s0YyDXtpE&list=RDr3s0YyDXtpE&start_radio=1";
        const ACCEPT_URL = "https://www.youtube.com/watch?v=kgUVq-ICt_Y&list=RDkgUVq-ICt_Y&start_radio=1";

        function spawnFloatingHearts() {
            const colors = ['#ff1493', '#ffd700', '#ff4d6d', '#ffffff', '#00f3ff'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.bottom = '-10px';
                    heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                    heart.style.fontSize = (Math.random() * 28 + 18) + 'px';
                    heart.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 4500);
                }, i * 60);
            }
        }

        btnReject.addEventListener('click', () => {
            window.location.href = REJECT_URL;
        });

        btnAccept.addEventListener('click', () => {
            spawnFloatingHearts();

            loveModal.classList.remove('opacity-0', 'pointer-events-none');
            loveModal.classList.add('opacity-100');
            modalBox.classList.remove('scale-90');
            modalBox.classList.add('scale-100');

            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 100);

            setTimeout(() => {
                window.location.href = ACCEPT_URL;
            }, 3200);
        });
    </script>
</body>
</html>
